name: "📄 Documentation"
description: Rédiger ou mettre à jour de la documentation
title: "[Docs] "
labels: ["documentation"]
body:

  - type: textarea
    id: besoin
    attributes:
      label: Besoin
      description: Quelle documentation manque ou doit être mise à jour ?
      placeholder: "Ex : Le README ne documente pas la procédure de déploiement sur Vercel."
    validations:
      required: true

  - type: textarea
    id: contenu
    attributes:
      label: Contenu à produire
      description: Décris précisément ce qui doit être écrit ou modifié.
      placeholder: |
        - Section déploiement Vercel
        - Liste des variables d'environnement requises
        - Procédure de rollback
    validations:
      required: true

  - type: checkboxes
    id: criteres
    attributes:
      label: Critères d'acceptation
      options:
        - label: Contenu rédigé et relu
        - label: Liens vérifiés et fonctionnels
        - label: Formatage Markdown correct
        - label: Merge request approuvée par un pair

  - type: dropdown
    id: perimetre
    attributes:
      label: Périmètre
      options:
        - Frontend
        - API
        - Mobile
        - Infra
        - CI/CD
        - Projet (transversal)
    validations:
      required: true

  - type: dropdown
    id: type-doc
    attributes:
      label: Type de document
      options:
        - README / guide de démarrage
        - Fiche de veille technologique
        - Documentation API (OpenAPI)
        - Plan de déploiement / maintenance
        - Wiki / notes internes
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes techniques
      description: Sources, fichiers à modifier, exemples existants à s'inspirer.
