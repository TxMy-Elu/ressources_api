name: CD — Build & Deploy

on:
  # Se déclenche UNIQUEMENT si CI + Security passent sur main
  workflow_run:
    workflows:
      - "CI — Tests & Quality"
      - "Security — CVE & OWASP"
    types: [completed]
    branches: [main]

  # Déploiement manuel (prod uniquement)
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible"
        required: true
        default: preprod
        type: choice
        options: [preprod, production]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # BUILD IMAGE DOCKER
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    # Bloque le build si CI ou Security ont échoué
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # DEPLOY PREPROD (automatique sur push main)
  # ──────────────────────────────────────────────────────────────────────────
  deploy-preprod:
    name: Deploy — Preprod
    runs-on: ubuntu-latest
    needs: build
    environment: preprod
    # Mettre PREPROD_ENABLED = true dans Settings > Variables quand le serveur est prêt
    if: vars.PREPROD_ENABLED == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy to preprod via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PREPROD_HOST }}
          username: ${{ secrets.PREPROD_USER }}
          key: ${{ secrets.PREPROD_SSH_KEY }}
          script: |
            cd /opt/ressources_api
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            export IMAGE_TAG=${{ needs.build.outputs.image_tag }}
            docker compose -f docker-compose.yaml -f docker-compose.preprod.yaml pull php
            docker compose -f docker-compose.yaml -f docker-compose.preprod.yaml up -d --no-deps php
            docker compose -f docker-compose.yaml -f docker-compose.preprod.yaml exec -T php php bin/console doctrine:migrations:migrate --no-interaction
            docker image prune -f

  # ──────────────────────────────────────────────────────────────────────────
  # DEPLOY PRODUCTION (manuel uniquement)
  # ──────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy — Production
    runs-on: ubuntu-latest
    needs: [build, deploy-preprod]
    environment: production
    # Mettre PROD_ENABLED = true dans Settings > Variables quand le serveur est prêt
    if: vars.PROD_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/ressources_api
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            export IMAGE_TAG=${{ needs.build.outputs.image_tag }}
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml pull php
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --no-deps php
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml exec -T php php bin/console doctrine:migrations:migrate --no-interaction
            docker image prune -f
