# ─────────────────────────────────────────────────────────────────────────────
# Nginx — Configuration PRODUCTION
# HTTPS obligatoire, HSTS, CSP, rate limiting sur /api/auth
#
# Prérequis :
#   - Certificats SSL dans le volume ssl_certs :
#       /etc/nginx/ssl/fullchain.pem
#       /etc/nginx/ssl/privkey.pem
#   - Adapter server_name au domaine réel
# ─────────────────────────────────────────────────────────────────────────────

# Rate limiting — zone partagée 10 Mo (≈ 160 000 IPs)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# ── Redirection HTTP → HTTPS ─────────────────────────────────────────────────
server {
    listen 80;
    server_name resources.fr www.resources.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Serveur HTTPS ────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name resources.fr www.resources.fr;

    root  /var/www/html/public;
    index index.php;

    # ── SSL ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:MozSSL:10m;
    ssl_session_tickets       off;

    # ── Headers de sécurité ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # ── Rate limiting sur les routes d'authentification ───────────────────────
    location ~ ^/api/(login|register|reset-password) {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        try_files $uri /index.php$is_args$args;

        location ~ \.php$ {
            fastcgi_pass  php:9000;
            fastcgi_index index.php;
            include       fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    # ── Routage Symfony ──────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # ── PHP-FPM ──────────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass          php:9000;
        fastcgi_index         index.php;
        include               fastcgi_params;
        fastcgi_param         SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout  60;
        fastcgi_buffers       8 16k;
        fastcgi_buffer_size   32k;
    }

    # ── Métriques Nginx (Prometheus) — réseau Docker uniquement ──────────────
    location /nginx_status {
        stub_status on;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
    }

    # ── Bloquer l'accès aux fichiers sensibles ────────────────────────────────
    location ~ /\.(ht|git|env|gitignore) {
        deny all;
        return 404;
    }

    # ── Logs JSON (Promtail → Loki) ───────────────────────────────────────────
    access_log /var/log/nginx/access.log json_access;
    error_log  /var/log/nginx/error.log  warn;
}
