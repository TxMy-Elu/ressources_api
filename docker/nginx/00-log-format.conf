# ─────────────────────────────────────────────────────────────────────────────
# Format de log JSON — chargé en premier (préfixe 00-)
# Utilisé par Promtail pour parser et envoyer les métriques HTTP à Loki
# ─────────────────────────────────────────────────────────────────────────────

log_format json_access escape=json
  '{'
    '"time":"$time_iso8601",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"query":"$query_string",'
    '"status":$status,'
    '"size":$body_bytes_sent,'
    '"req_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"ip":"$remote_addr",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
  '}';
