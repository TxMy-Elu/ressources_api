; ─────────────────────────────────────────────────────────────────────────────
; Configuration PHP — Production
; ─────────────────────────────────────────────────────────────────────────────

; Timezone
date.timezone = Europe/Paris

; Limites mémoire / temps
memory_limit          = 256M
max_execution_time    = 30
max_input_time        = 30
upload_max_filesize   = 20M
post_max_size         = 20M

; Sécurité — ne pas exposer d'infos serveur
expose_php            = Off
display_errors        = Off
display_startup_errors = Off
log_errors            = On
error_log             = /var/www/html/var/log/php_errors.log
error_reporting       = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ─────────────────────────────────────────────────────────────────────────────
; OPcache — Optimisation performances production
; ─────────────────────────────────────────────────────────────────────────────
opcache.enable                 = 1
opcache.enable_cli             = 0
opcache.memory_consumption     = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files  = 20000
; En prod : désactiver la revalidation (les fichiers ne changent pas)
opcache.validate_timestamps    = 0
opcache.revalidate_freq        = 0
; Nécessaire pour les annotations Doctrine / attributs PHP
opcache.save_comments          = 1
opcache.fast_shutdown          = 1
opcache.max_wasted_percentage  = 10
