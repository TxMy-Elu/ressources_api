; ─────────────────────────────────────────────────────────────────────────────
; PHP-FPM Pool www — configuration supplémentaire
; Active la page /status nécessaire au php-fpm_exporter (Prometheus)
; ─────────────────────────────────────────────────────────────────────────────

[www]

; Page de statut PHP-FPM — requise par hipages/php-fpm_exporter
; Accessible via FastCGI (pas exposée HTTP directement)
pm.status_path = /status

; ── Gestion du pool (à ajuster selon la charge) ───────────────────────────

; dev / pré-prod
pm = dynamic
pm.max_children      = 20
pm.start_servers     = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests      = 500

; Log des requêtes lentes — décommenter si var/log/ existe
; slowlog = /var/www/html/var/log/php-fpm-slow.log
; request_slowlog_timeout = 5s
