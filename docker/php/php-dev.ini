; ─────────────────────────────────────────────────────────────────────────────
; OPcache agressif pour dev sur Docker Desktop Windows
; validate_timestamps=0 : ne relit pas les fichiers à chaque requête
; → redémarrer PHP-FPM après modification de fichiers PHP :
;   docker restart resources_php
; ─────────────────────────────────────────────────────────────────────────────

[opcache]
opcache.enable                 = 1
opcache.memory_consumption     = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files  = 20000
opcache.validate_timestamps    = 0
opcache.save_comments          = 1
opcache.fast_shutdown          = 1
