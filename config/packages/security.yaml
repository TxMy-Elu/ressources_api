security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        doc:
            pattern: ^/api/doc
            security: false

        cors:
            pattern: ^/api/
            methods: [OPTIONS]
            security: false

        login:
            pattern: ^/api/login
            stateless: true
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            entry_point: jwt
            jwt: ~

    access_control:
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/me, roles: ROLE_CONNECTED }
        - { path: ^/api/resources/share/, roles: PUBLIC_ACCESS }
        - { path: ^/api/resources, methods: [ GET ], roles: PUBLIC_ACCESS }
        - { path: ^/api/categories, methods: [ GET ], roles: PUBLIC_ACCESS }
        - { path: ^/api/resources, methods: [ POST, PUT, DELETE ], roles: ROLE_CONNECTED }
        - { path: ^/api/moderation, roles: ROLE_ADMIN }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api, roles: ROLE_CONNECTED }




    role_hierarchy:
        ROLE_CONNECTED: ROLE_USER
        ROLE_MODERATOR: ROLE_CONNECTED
        ROLE_ADMIN: ROLE_MODERATOR
        ROLE_SUPER_ADMIN: ROLE_ADMIN

