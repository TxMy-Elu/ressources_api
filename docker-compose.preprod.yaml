# ─────────────────────────────────────────────────────────────────────────────
# Surcharge PRÉ-PROD — environnement de recette / staging
#
# Lancement :
#   docker compose -f docker-compose.yaml -f docker-compose.preprod.yaml up -d --build
#
# Caractéristiques :
#   - Image construite avec Dockerfile.prod (Alpine, pas de xdebug, OPcache)
#   - APP_ENV=prod, APP_DEBUG=0
#   - Base de données resources_preprod (isolée de dev)
#   - Migrations exécutées au démarrage
#   - Pas de phpmyadmin exposé publiquement
#   - Ports décalés (8082, 3308) pour coexister avec dev
# ─────────────────────────────────────────────────────────────────────────────

services:

  nginx:
    ports:
      - "8082:80"
    volumes:
      - ./docker/nginx/preprod.conf:/etc/nginx/conf.d/default.conf:ro

  php:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: resources-api:preprod
    restart: unless-stopped
    volumes:
      - ./docker/php/fpm-www.conf:/usr/local/etc/php-fpm.d/zz-www.conf:ro
    env_file:
      - .env.preprod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DATABASE_URL: "mysql://app:${DB_PASSWORD:-app}@database:3306/resources_preprod?serverVersion=8.0&charset=utf8mb4"
    # Migrations + warmup au démarrage du conteneur
    command: >
      sh -c "
        php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration &&
        php bin/console cache:warmup --env=prod &&
        php-fpm
      "
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>&1 | grep -q 'successful'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  database:
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_preprod}
      MYSQL_DATABASE: resources_preprod
      MYSQL_USER: app
      MYSQL_PASSWORD: ${DB_PASSWORD:-app}
    ports:
      - "3308:3306"   # Ne pas exposer en production réelle
