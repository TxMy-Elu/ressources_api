# ─────────────────────────────────────────────────────────────────────────────
# Base commune — services partagés entre tous les environnements
#
# DEV      : docker compose up -d
# PRÉ-PROD : docker compose -f docker-compose.yaml -f docker-compose.preprod.yaml up -d --build
# PROD     : docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  nginx:
    image: nginx:alpine
    container_name: resources_nginx
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - resources_network

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resources_php
    depends_on:
      database:
        condition: service_healthy
    networks:
      - resources_network

  database:
    image: mysql:8.0
    container_name: resources_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-resources}
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "app", "-papp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - resources_network

volumes:
  db_data:

networks:
  resources_network:
    driver: bridge
